<style>
  .head { padding: 44px 0 18px 0; }
  .head h1 { font: 500 34px/1.15 Georgia, serif; margin: 0 0 8px 0; }
  .head p { font-size: 15px; color: #566059; max-width: 46em; line-height: 1.6; margin: 0; }
  .lang span { cursor: pointer; }
  .panel { display: grid; grid-template-columns: 270px 1fr; gap: 18px; padding-bottom: 60px; align-items: start; }
  .side { background: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 16px; position: sticky; top: 70px; }
  .side h4 { font: 700 10.5px/1 Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px 0; display: flex; justify-content: space-between; }
  .side h4 span { font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--forest-soft); cursor: pointer; }
  .side label { display: flex; gap: 8px; align-items: center; padding: 5px 0; font-size: 13.5px; }
  .side .grp { margin-bottom: 16px; }
  .search { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font-size: 13px; font-family: inherit; margin-bottom: 8px; }
  .list { max-height: 210px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  .list label { padding: 4px 4px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .list label:hover { background: var(--paper); }
  .list label small { margin-left: auto; min-width: 3ch; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .list label.zero { opacity: .45; }
  .list label.hide { display: none; }
  .tokens { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 0; }
  .tokens:empty { display: none; }
  .token { display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px; border-radius: 5px; background: var(--paper-deep); font-size: 12px; font-weight: 600; }
  .token b { font-weight: 400; color: var(--muted); cursor: pointer; }
  .count { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .count b { color: var(--ink); font-weight: 600; }
  .charts { display: flex; flex-direction: column; gap: 14px; }
  .chart { background: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; position: relative; }
  .chart h3 { font: 500 18px/1.2 Georgia, serif; margin: 0 26px 4px 0; }
  .chart .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
  .chart .x { position: absolute; right: 12px; top: 12px; border: 0; background: none; font-size: 18px; color: var(--muted); cursor: pointer; }
  .chart .x:hover { color: var(--ink); }
  .legend { display: flex; gap: 14px; font-size: 12.5px; margin-top: 10px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .empty { padding: 34px 20px; text-align: center; color: var(--muted); font-size: 14px; border: 1px dashed var(--line); border-radius: 8px; }
  .series { margin-top: 16px; }
  .series h4 { font: 700 10.5px/1 Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px 0; }
  .ser { display: grid; grid-template-columns: 22px 1fr auto auto auto; gap: 12px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--white); margin-bottom: 6px; font-size: 13px; cursor: pointer; }
  .ser:hover { background: var(--paper); } .ser.on { border-color: var(--forest); background: #eaf0ec; }
  .ser.dead { cursor: default; opacity: .55; } .ser.dead:hover { background: var(--white); }
  .ser .box { width: 16px; height: 16px; border: 1.5px solid var(--muted); border-radius: 4px; display: inline-block; position: relative; }
  .ser.on .box { background: var(--forest); border-color: var(--forest); } .ser.on .box::after { content: ""; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px; border: solid var(--white); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .ser.dead .box { border-style: dashed; }
  .ser .t { font-weight: 600; } .ser .t small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .ser .m { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ser .lay { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .ser .lay.engineering { color: var(--clay); border-color: var(--clay); } .ser .lay.reference { color: var(--forest-soft); border-color: var(--forest-soft); }
  .chart svg text { font-family: Inter, sans-serif; }
  .chart svg .dot:hover { r: 5; }
  @media (max-width: 800px) { .panel { grid-template-columns: 1fr; } .side { position: static; } }
</style>

<div class="wrap">

  <div class="panel">
    <aside class="side">
      <div class="grp"><h4><span class="lbl-c">Страны</span><span id="rc">сбросить</span></h4>
        <input class="search" id="qc" placeholder="Страна">

<script src="assets/datasets-data.js"></script>
<script src="assets/chart-index.js"></script>
<script>
  const D = window.DATASETS, L = window.DATASET_LABELS, C = window.CHARTS || {};
  const состояние = { lang: "ru", countries: new Set(), topics: new Set(), layers: new Set(["historical", "engineering", "reference"]), picks: [] };
  const кэш = {};
  const T = {
    ru: { h1: "Витрина", intro: "Временные ряды корпуса на графиках, ровно по строкам наборов. Отметьте ряды в списке: на каждый отмеченный - свой график; график строится только у наборов с осью времени и числами, остальные в списке погашены.",
      c: "Страны", i: "Показатель", l: "Слой", reset: "сбросить", lh: "Историческое", le: "Инженерное (с точностью)", lr: "Справочное CFR", sh: "Ряды по выбору", qc: "Страна", qi: "Начните вводить: насел.., зарп..",
      count: (n, m, k) => `Рядов по выбору: <b>${n}</b> из ${m}, с графиком ${k}`, empty: "По этому выбору рядов нет. Снимите часть фильтров.", noChart: "нет графика: у набора нет оси времени или чисел", rows: (n) => `${n} строк`, open: "Открыть набор →", sub: (з) => `${з.sources[0] ?? "паспорт"} · ${L.слой.ru[з.layer] ?? з.layer}`,
      choose: "Отметьте ряды в списке ниже: на каждый будет свой график.", loading: "загрузка строк…", all: "всё", nav: ["Обзор", "Витрина", "Покрытие", "Конструктор", "Исходные данные", "Источники", "Территории"], acc: "Личный кабинет", countries: (n) => `${n} стран`, close: "убрать график", points: (n) => `${n} точек` },
    en: { h1: "Showcase", intro: "Time series of the corpus, exactly as in the dataset rows. Tick series in the list: each ticked one gets its own chart; charts exist only for datasets with a time axis and numbers, the rest are dimmed.",
      c: "Countries", i: "Indicator", l: "Layer", reset: "reset", lh: "Historical", le: "Engineering (with accuracy)", lr: "CFR reference", sh: "Series for this selection", qc: "Country", qi: "Start typing: popul.., wage..",
      count: (n, m, k) => `Series for this selection: <b>${n}</b> of ${m}, chartable ${k}`, empty: "No series for this selection. Remove some filters.", noChart: "no chart: the dataset has no time axis or numbers", rows: (n) => `${n} rows`, open: "Open dataset →", sub: (з) => `${з.sources[0] ?? "passport"} · ${L.слой.en[з.layer] ?? з.layer}`,
      choose: "Tick series in the list below: each gets its own chart.", loading: "loading rows…", all: "all", nav: ["Overview", "Showcase", "Coverage", "Builder", "Source data", "Sources", "Territories"], acc: "Account", countries: (n) => `${n} countries`, close: "remove chart", points: (n) => `${n} points` },
  };
  const t = () => T[состояние.lang];
  const экр = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const заголовок = (з) => (состояние.lang === "en" ? (з.titleEn || з.titleRu) : (з.titleRu || з.titleEn)) || з.id;
  const страна = (з) => з.countries.includes("ww") ? t().countries(з.countryCount ?? 0) : з.countries.map((c) => L.страны[состояние.lang][c] ?? c).join(", ");
  const подходит = (з, без) => (без === "countries" || !состояние.countries.size || з.countries.some((c) => состояние.countries.has(c)))
    && (без === "topics" || !состояние.topics.size || состояние.topics.has(з.topic)) && (без === "layers" || состояние.layers.has(з.layer));
  const ЦВЕТА = ["#173d32", "#c76743", "#d3a841", "#275949", "#9a8bb8", "#5b8a6e", "#8a5a44", "#68716b"];
  const число = (v) => typeof v === "number" ? v : (typeof v === "string" && /^-?\d+(\.\d+)?$/.test(v.trim()) ? Number(v) : null);
  const год = (v) => { const m = String(v ?? "").match(/(\d{4})/); return m ? Number(m[1]) : null; };

  function список(id, ключи, подписи, набор, q, счёт) {
    const el = document.getElementById(id);
    el.innerHTML = ключи.map((k) => { const n = счёт(k); const скрыт = q && !подписи[k].toLowerCase().includes(q.toLowerCase()); return `<label class="${n ? "" : "zero"} ${скрыт ? "hide" : ""}"><input type="checkbox" data-k="${k}" ${набор.has(k) ? "checked" : ""}> ${экр(подписи[k])}<small>${n}</small></label>`; }).join("");
    el.querySelectorAll("input").forEach((i) => i.addEventListener("change", () => { if (i.checked) набор.add(i.dataset.k); else набор.delete(i.dataset.k); пишиХэш(); рисуй(); }));
  }
  function жетоны(id, набор, подписи) {
    const el = document.getElementById(id);
    el.innerHTML = [...набор].map((k) => `<span class="token">${экр(подписи[k] ?? k)}<b data-k="${k}">×</b></span>`).join("");
    el.querySelectorAll("b").forEach((b) => b.addEventListener("click", () => { набор.delete(b.dataset.k); пишиХэш(); рисуй(); }));
  }

  async function строки(з) {
    if (кэш[з.id]) return кэш[з.id];
    const r = await fetch("data/" + C[з.id].file);
    const j = await r.json();
    кэш[з.id] = j.rows ?? [];
    return кэш[з.id];
  }
  function svgГрафик(линии) {
    // линии: [{name, points: [{x, y}]}]
    const W = 640, H = 300, x0 = 52, x1 = 624, y0 = 262, y1 = 22;
    const все = линии.flatMap((l) => l.points);
    const xmin = Math.min(...все.map((p) => p.x)), xmax = Math.max(...все.map((p) => p.x));
    const ymin = Math.min(0, ...все.map((p) => p.y)), ymax = Math.max(...все.map((p) => p.y));
    const X = (x) => xmax === xmin ? (x0 + x1) / 2 : x0 + (x - xmin) / (xmax - xmin) * (x1 - x0);
    const Y = (y) => ymax === ymin ? (y0 + y1) / 2 : y0 - (y - ymin) / (ymax - ymin) * (y0 - y1);
    const фмт = (v) => Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + "M" : Math.abs(v) >= 1e4 ? (v / 1e3).toFixed(0) + "k" : String(Math.round(v * 100) / 100);
    const деления = [0, .25, .5, .75, 1].map((f) => ymin + (ymax - ymin) * f);
    const сетка = деления.map((v) => `<line x1="${x0}" y1="${Y(v).toFixed(1)}" x2="${x1}" y2="${Y(v).toFixed(1)}" stroke="#e7e1d5"/><text x="${x0 - 6}" y="${(Y(v) + 4).toFixed(1)}" font-size="10" fill="#68716b" text-anchor="end">${фмт(v)}</text>`).join("");
    const годы = xmax - xmin >= 4 ? [0, .25, .5, .75, 1].map((f) => Math.round(xmin + (xmax - xmin) * f)) : [...new Set(все.map((p) => p.x))];
    const осьX = годы.map((v) => `<text x="${X(v).toFixed(1)}" y="${y0 + 16}" font-size="10" fill="#68716b" text-anchor="middle">${v}</text>`).join("");
    const кривые = линии.map((l, i) => { const c = ЦВЕТА[i % ЦВЕТА.length]; const pts = l.points.map((p) => `${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" "); const точки = l.points.length <= 400 ? l.points.map((p) => `<circle class="dot" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${l.points.length > 120 ? 1.5 : 3}" fill="${c}"><title>${экр(l.name)}: ${p.x} = ${p.y}</title></circle>`).join("") : ""; return `<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts}"/>${точки}`; }).join("");
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="#8a918c"/>${сетка}${осьX}${кривые}</svg>`;
  }
  async function график(з, el) {
    const spec = C[з.id];
    el.innerHTML = `<button class="x" title="${t().close}" data-x="${экр(з.id)}">×</button><h3>${экр(заголовок(з))}</h3><div class="sub">${t().loading}</div>`;
    el.querySelector(".x").addEventListener("click", () => { состояние.picks = состояние.picks.filter((id) => id !== з.id); пишиХэш(); рисуй(); });
    let rows; try { rows = await строки(з); } catch (e) { el.querySelector(".sub").textContent = "не удалось загрузить строки"; return; }
    let линии;
    const подпись = (l, зап) => (l.label && (l.label[состояние.lang] ?? l.label.ru ?? l.label.en)) || зап;
    if (spec.by) линии = spec.lines.map((l) => ({ name: подпись(l, l.group), points: rows.filter((r) => String(r[spec.by]) === l.group).map((r) => ({ x: год(r[spec.x]), y: число(r[l.key]) })).filter((p) => p.x !== null && p.y !== null) }));
    else линии = spec.lines.map((l) => ({ name: подпись(l, l.key), points: rows.map((r) => ({ x: год(r[spec.x]), y: число(r[l.key]) })).filter((p) => p.x !== null && p.y !== null) }));
    линии = линии.filter((l) => l.points.length >= 2).map((l) => ({ ...l, points: l.points.sort((a, b) => a.x - b.x) }));
    if (!линии.length) { el.querySelector(".sub").textContent = t().noChart; return; }
    const n = линии.reduce((a, l) => a + l.points.length, 0);
    el.innerHTML = `<button class="x" title="${t().close}" data-x="${экр(з.id)}">×</button><h3>${экр(заголовок(з))}</h3><div class="sub">${экр(з.sources[0] ?? "")} · ${экр(L.слой[состояние.lang][з.layer] ?? з.layer)} · ${t().points(n)} · <a href="dataset.html#${encodeURIComponent(з.id)}${состояние.lang === "en" ? "&lang=en" : ""}">${t().open}</a></div>
      ${svgГрафик(линии)}<div class="legend">${линии.map((l, i) => `<span><i style="background:${ЦВЕТА[i % ЦВЕТА.length]}"></i>${экр(l.name)}</span>`).join("")}</div>`;
    el.querySelector(".x").addEventListener("click", () => { состояние.picks = состояние.picks.filter((id) => id !== з.id); пишиХэш(); рисуй(); });
  }

  function рисуй() {
    document.documentElement.lang = состояние.lang;
    document.title = состояние.lang === "en" ? "CFR Project - Showcase" : "CFR Project - Витрина";
    for (const s of document.querySelectorAll("#lang span")) s.classList.toggle("on", s.dataset.lang === состояние.lang);
    document.querySelectorAll(".topnav a").forEach((a, i) => { a.textContent = t().nav[i]; });
    document.querySelector(".account span").textContent = t().acc;
    document.getElementById("h1").textContent = t().h1; document.getElementById("intro").textContent = t().intro;
    document.querySelector(".lbl-c").textContent = t().c; document.querySelector(".lbl-i").textContent = t().i; document.querySelector(".lbl-l").textContent = t().l;
    document.getElementById("rc").textContent = t().reset; document.getElementById("ri").textContent = t().reset; document.getElementById("sh").textContent = t().sh;
    document.querySelector(".lbl-lh").textContent = t().lh; document.querySelector(".lbl-le").textContent = t().le; document.querySelector(".lbl-lr").textContent = t().lr;
    document.getElementById("qc").placeholder = t().qc; document.getElementById("qi").placeholder = t().qi;
    const страны = L.страны[состояние.lang], темы = L.темы[состояние.lang];
    const порядокС = Object.keys(L.страны.ru).sort((a, b) => D.filter((з) => з.countries.includes(b)).length - D.filter((з) => з.countries.includes(a)).length);
    список("lc", порядокС, страны, состояние.countries, document.getElementById("qc").value, (k) => D.filter((з) => подходит(з, "countries") && з.countries.includes(k)).length);
    список("li", Object.keys(L.темы.ru), темы, состояние.topics, document.getElementById("qi").value, (k) => D.filter((з) => подходит(з, "topics") && з.topic === k).length);
    жетоны("tc", состояние.countries, страны); жетоны("ti", состояние.topics, темы);
    document.querySelectorAll("[data-layer]").forEach((i) => { i.checked = состояние.layers.has(i.dataset.layer); });
    const ряды = D.filter((з) => подходит(з)).sort((a, b) => (C[b.id] ? 1 : 0) - (C[a.id] ? 1 : 0) || заголовок(a).localeCompare(заголовок(b), состояние.lang));
    document.getElementById("cnt").innerHTML = t().count(ряды.length, D.length, ряды.filter((з) => C[з.id]).length);
    // Отмеченные ряды: только те, что есть в текущем списке и рисуемы.
    состояние.picks = состояние.picks.filter((id) => C[id] && ряды.some((з) => з.id === id));
    document.getElementById("list").innerHTML = ряды.length ? ряды.map((з) => { const ok = !!C[з.id]; const on = состояние.picks.includes(з.id); return `<div class="ser ${on ? "on" : ""} ${ok ? "" : "dead"}" data-id="${экр(з.id)}" ${ok ? "" : `title="${t().noChart}"`}><span class="box"></span><div class="t">${экр(заголовок(з))}<small>${экр(t().sub(з))}${ok ? "" : " · " + t().noChart}</small></div><div class="m">${экр(страна(з))}</div><div class="m">${з.start ? `${з.start}-${з.end}` : ""} · ${t().rows(з.rows ?? 0)}</div><span class="lay ${з.layer}">${экр(L.слой[состояние.lang][з.layer] ?? з.layer)}</span></div>`; }).join("") : `<div class="empty">${t().empty}</div>`;
    document.querySelectorAll(".ser:not(.dead)").forEach((el) => el.addEventListener("click", () => { const id = el.dataset.id; состояние.picks = состояние.picks.includes(id) ? состояние.picks.filter((x) => x !== id) : [...состояние.picks, id]; пишиХэш(); рисуй(); }));
    const charts = document.getElementById("charts");
